[package]
name = "sopsy"
version = "2.0.0"
edition = "2024"
description = "Sopsy is a friendlier front end for SOPS. It wraps age, sops and age plugins so each developer encrypts repo secrets with a private key minted in hardware. On Apple Silicon Macs that’s the Secure Enclave or Keychain, and on macOS or Linux it can be a YubiKey, with biometric unlock where supported. Access is explicit. A new teammate pulls the repo, runs `sopsy join <name>`, and can decrypt once someone approves them. When people leave, you remove their key. Only approved people can read the secrets, so committing them to git is safe, and nobody has to Slack a .env file around. Secrets also never sit decrypted on disk. Sopsy decrypts them on the fly and exports them into your shell through eval. It works for API keys, license serials and any other sensitive file your team shares."
license = "MIT"
repository = "https://github.com/kigster/sopsy.git"
homepage = "https://sopsy-cli.dev"
keywords = ["sops", "secrets", "age", "macos", "enclave"]
categories = ["command-line-utilities", "config"]

[dependencies]
anyhow = "1.0.103"
# `wrap_help` makes clap honor terminal width and the `max_term_width` cap.
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
color-eyre = "0.6.5"
# Signal handler (SIGINT/SIGTERM/SIGHUP) so the portable-key ceremony can shred
# the on-disk private key even when the process is interrupted mid-flow (Ctrl-C
# at the prompt). `termination` adds SIGTERM/SIGHUP on top of Ctrl-C.
ctrlc = { version = "3.4", features = ["termination"] }
# RFC3339 timestamps and human-friendly duration parsing/formatting for the
# join-request freshness window (`requested_at` / `join_request_ttl`).
humantime = "2.2"
indicatif = "0.18.4"
inquire = "0.9.4"
# Raw-mode key input for the checklist prompt (`ui/checklist.rs`); the same
# version inquire already pulls in.
crossterm = "0.29"
owo-colors = "4.3.0"
# Terminal width detection for the full-width banner boxes in `ui.rs`.
terminal_size = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
# SHA-256 for the `.sopsy.yml` integrity checksum (tamper evidence, not
# encryption — all encryption remains delegated to the external `sops`).
sha2 = "0.10"
# serde_yaml is deprecated/archived upstream; serde_yaml_ng is the actively
# maintained drop-in replacement used for `.sops.yaml` and `.sopsy.yml`.
serde_yaml_ng = "0.10.0"
thiserror = "2.0.17"
tempfile = "3.27.0"
toml = "1.1.2"
which = "8.0.4"

[dev-dependencies]
assert_cmd = "2.0.17"
assert_fs = "1.1.3"
predicates = "3.1.3"
serial_test = "3.2.0"
