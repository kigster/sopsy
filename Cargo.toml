[package]
name = "sopsy"
version = "1.4.0"
edition = "2024"
description = "Public/private individual key encryption for repo secrets with biometrics support and explicit approval of who can decrypt. In other words — the missing good UX for SOPS. In more details, however it's a convenience wrapper around age, sops and various age plugins, allowing you to encrypt your dev secrets using private keys minted on the hardware (either in Mac's Enclave for M1, M2, ...), or YubiKey (both MacOS and Linux are supported), or on the Mac you can also use KeyChain. With sops powering it, the team that needs access must onboard and be approved one at a time, and similarly an employee who left can be removed from the chain. This ensures only those who are supposed to see dev secrets do, and you can safely commit them into git, instead of 'let me just slack my .env to you', which is what most teams do, you just git pull from the repo, run 'sopsy join <name>' and as sooon as someone approves it you can decrypt. Sopsy solves several security related developer-flow problems, the main one being — not having your dev secrets lying around decrypted on your file system, and to load them into environment  by decrypting them on the fly, and running shell's eval() and exporting the variables. In other words, sopsy facilitates each team member's biometric key in the process of encryption and decryption of the sensitive files, such as API keys, serial numbers, and more. And it comes to you with git pull!"
license = "MIT"
repository = "https://github.com/kigster/sopsy.git"
homepage = "https://sopsy-cli.dev"
keywords = ["sops", "secrets", "age", "macos", "enclave"]
categories = ["command-line-utilities", "config"]

[dependencies]
anyhow = "1.0.103"
# `wrap_help` makes clap honor terminal width and the `max_term_width` cap.
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
color-eyre = "0.6.5"
# Signal handler (SIGINT/SIGTERM/SIGHUP) so the portable-key ceremony can shred
# the on-disk private key even when the process is interrupted mid-flow (Ctrl-C
# at the prompt). `termination` adds SIGTERM/SIGHUP on top of Ctrl-C.
ctrlc = { version = "3.4", features = ["termination"] }
# RFC3339 timestamps and human-friendly duration parsing/formatting for the
# join-request freshness window (`requested_at` / `join_request_ttl`).
humantime = "2.2"
indicatif = "0.18.4"
inquire = "0.9.4"
# Raw-mode key input for the checklist prompt (`ui/checklist.rs`); the same
# version inquire already pulls in.
crossterm = "0.29"
owo-colors = "4.3.0"
# Terminal width detection for the full-width banner boxes in `ui.rs`.
terminal_size = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
# SHA-256 for the `.sopsy.yml` integrity checksum (tamper evidence, not
# encryption — all encryption remains delegated to the external `sops`).
sha2 = "0.10"
# serde_yaml is deprecated/archived upstream; serde_yaml_ng is the actively
# maintained drop-in replacement used for `.sops.yaml` and `.sopsy.yml`.
serde_yaml_ng = "0.10.0"
thiserror = "2.0.17"
tempfile = "3.27.0"
toml = "1.1.2"
which = "8.0.4"

[dev-dependencies]
assert_cmd = "2.0.17"
assert_fs = "1.1.3"
predicates = "3.1.3"
serial_test = "3.2.0"
